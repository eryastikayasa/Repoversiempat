name: Resize Role Text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resize role text buffers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          web = Path('components/web_config/web_config.cpp')
          s = web.read_text()
          s = s.replace('static EXT_RAM_BSS_ATTR char content[2048];', 'static EXT_RAM_BSS_ATTR char content[8192];')
          s = s.replace('char role_text[512] = "";', 'char role_text[2048] = "";')
          s = s.replace('char decoded[512] = "";', 'char decoded[2048] = "";')
          web.write_text(s)

          ws = Path('components/websocket/websocket_json.cpp')
          s = ws.read_text()
          s = s.replace('static char role_text[512];', 'static char role_text[2048];')
          ws.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/web_config/web_config.cpp components/websocket/websocket_json.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Increase role text capacity to 2048 bytes"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/role_text_resize.yml
          git commit -m "chore: remove temporary role text resize workflow"
          git push
