name: WakeNet9 Runtime Audit

on:
  workflow_run:
    workflows:
      - Build ESP32-S3 Firmware
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Verify WakeNet9 Hi ESP
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Download successful firmware artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: ESP32S3-Firmware-Full
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Audit WakeNet9 configuration and source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== WAKENET9 HI ESP AUDIT ==="
          echo "--- sdkconfig.defaults ---"
          grep -E '^CONFIG_SR_WN_WN9_HIESP=y$' sdkconfig.defaults
          grep -E '^CONFIG_ESP32S3_SPIRAM_SUPPORT=y$' sdkconfig.defaults
          grep -E '^CONFIG_SPIRAM_MODE_OCT=y$' sdkconfig.defaults
          grep -E '^CONFIG_SPIRAM_SPEED_80M=y$' sdkconfig.defaults
          echo "--- source integration ---"
          grep -n 'WAKE_MODEL_NAME "wn9_hiesp"' main/main.cpp
          grep -n 'static bool wakeword_init' main/main.cpp
          grep -n 'esp_srmodel_init("model")' main/main.cpp
          grep -n 'esp_srmodel_exists' main/main.cpp
          grep -n 'esp_wn_handle_from_name(WAKE_MODEL_NAME)' main/main.cpp
          grep -n 'wake_iface->create(WAKE_MODEL_NAME, DET_MODE_90)' main/main.cpp
          grep -n 'wake_iface->detect(wake_model, wake_pcm)' main/main.cpp
          grep -n 'WAKE WORD TERDETEKSI: HI, ESP' main/main.cpp
          echo "--- model partition ---"
          grep -E '^model,.*0x400000' partitions/partitions.csv
          if [ -f artifacts/firmware.elf ]; then
            ELF=artifacts/firmware.elf
            echo "--- compiled ELF strings ---"
            strings "$ELF" | grep -F 'ESP-SR WAKE WORD INIT'
            strings "$ELF" | grep -F 'WakeNet ready:'
            strings "$ELF" | grep -F 'Wake word aktif: HI, ESP'
            strings "$ELF" | grep -F 'WAKE WORD TERDETEKSI: HI, ESP'
            strings "$ELF" | grep -F 'wn9_hiesp'
            echo "Compiled WakeNet9 integration: PASS"
          else
            echo "No firmware artifact in manual audit; source/config checks passed."
          fi
          echo "========================================"
          echo "WAKENET9 HI ESP AUDIT: PASS"
          echo "Config + model + runtime integration verified"
          echo "========================================"
