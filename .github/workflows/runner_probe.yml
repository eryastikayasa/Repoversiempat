name: GitHub Runner Probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  probe:
    name: Probe ubuntu-slim runner
    runs-on: ubuntu-slim
    steps:
      - name: Probe runner
        run: |
          set -euo pipefail
          echo "RUNNER_OK"
          uname -a
          echo "Runner: $RUNNER_NAME"
          echo "Image: $ImageOS"
